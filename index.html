<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barat Invitation</title>
<meta name="description" content="You are cordially invited to the Barat of Huzifa Rasheed, Saturday 14 November 2026, 12 PM to 4 PM, Al Firdous Marriage Hall, Islamabad.">
<meta property="og:title" content="Barat Invitation · 14 November 2026">
<meta property="og:description" content="Huzifa Rasheed & Daughter of Badshah Umar · 12 PM – 4 PM · Al Firdous Marriage Hall, Islamabad">
<meta property="og:image" content="card.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Great+Vibes&family=Gulzar&family=Noto+Nastaliq+Urdu:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--page:#141010;--page-ink:#e9dcc6;--chip:#1f1817;--gold:#c9a14a}
*{box-sizing:border-box;margin:0}
body{background:var(--page);color:var(--page-ink);font-family:"Cormorant Garamond",Georgia,serif;font-variant-numeric:lining-nums;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 48px;transition:background .6s;
  background-image:radial-gradient(circle at 15% 0%,#3a1216 0,transparent 40%),radial-gradient(circle at 90% 100%,#2c2210 0,transparent 45%)}
body.light{--page:#f3e6e6;--page-ink:#3b2a31;--chip:#fffafa;background-image:radial-gradient(circle at 15% 8%,#fbeff1 0,transparent 45%),radial-gradient(circle at 90% 95%,#ecd7dc 0,transparent 45%)}

/* ---------- design picker ---------- */
.picker{width:min(100%,560px);margin-bottom:16px}
.picker h1{font:400 32px/1.1 "Great Vibes",cursive;color:var(--gold);text-align:center}
.picker p{text-align:center;font-size:15px;opacity:.8;margin:4px 0 12px}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.chip{appearance:none;border:1.5px solid #c9a14a44;background:var(--chip);color:inherit;border-radius:14px;padding:8px 4px 7px;cursor:pointer;
  font:600 12.5px/1.15 "Cormorant Garamond",serif;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .2s,border-color .2s}
.chip:hover{transform:translateY(-2px)}
.chip[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 2px #c9a14a55}
.chip:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sw{width:34px;height:34px;border-radius:50%;border:1.5px solid #c9a14a88}
.blurb{text-align:center;font-style:italic;font-size:16px;min-height:2.6em;margin-top:10px;opacity:.9}
@media (max-width:420px){.chip{font-size:11px}.sw{width:28px;height:28px}}

/* ---------- card + themes ---------- */
.card{width:min(100%,560px);aspect-ratio:1135/1600;container-type:inline-size;position:relative;overflow:hidden;border-radius:6px;
  background:var(--bg);box-shadow:0 30px 70px -24px var(--shadow),0 4px 14px #0004;isolation:isolate;transition:background .6s}
.card::before{content:"";position:absolute;inset:0;background:var(--wash);z-index:0}
.card[data-theme="midnight"]{--bg:radial-gradient(ellipse 80% 60% at 50% 45%,#1e1515 0,#0b0808 75%);
  --wash:radial-gradient(ellipse 55% 30% at 0% 0%,#5a0a1488 0,transparent 70%),radial-gradient(ellipse 55% 30% at 100% 100%,#5a0a1477 0,transparent 70%),radial-gradient(ellipse 45% 30% at 50% 50%,#c9a14a10 0,transparent 70%);
  --shadow:#000;--name:#e8c877;--accent:#e2303f;--label:#c9a14a;--body:#eadfca;--strong:#f0d28a;--rule:#b52331;
  --box:#ffffff07;--boxline:#c9a14a59;--f1:#c9a14a;--f2:#7d1520;--grain:.32;--blend:soft-light}
.card[data-theme="lacquer"]{--bg:linear-gradient(160deg,#9a1424 0%,#6e0b17 48%,#3c050b 100%);
  --wash:radial-gradient(ellipse 60% 35% at 20% 8%,#ffffff1c 0,transparent 70%),radial-gradient(ellipse 70% 30% at 50% 100%,#00000055 0,transparent 70%);
  --shadow:#3c050b;--name:#f5d685;--accent:#ffe7b0;--label:#f2c766;--body:#fbeee0;--strong:#fff1cf;--rule:#e8b84a;
  --box:#00000026;--boxline:#e8b84a80;--f1:#e8b84a;--f2:#2a0408;--grain:.35;--blend:soft-light}
.card[data-theme="thread"]{--bg:radial-gradient(ellipse 85% 65% at 50% 42%,#1a1312 0,#090707 78%);
  --wash:radial-gradient(ellipse 50% 22% at 50% 4%,#c9a14a14 0,transparent 70%);
  --shadow:#000;--name:#ecd08a;--accent:#d8283a;--label:#c9a14a;--body:#eadfca;--strong:#f0d28a;--rule:#c9a14a;
  --box:#ffffff06;--boxline:#c9a14a52;--f1:#c9a14a;--f2:#c9a14a;--grain:.3;--blend:soft-light}
.card[data-theme="breeze"]{--bg:linear-gradient(175deg,#1c1714 0%,#120e0d 55%,#0a0807 100%);
  --wash:radial-gradient(ellipse 60% 30% at 10% 5%,#6a0e1866 0,transparent 70%),radial-gradient(ellipse 50% 25% at 100% 60%,#c9a14a12 0,transparent 70%);
  --shadow:#000;--name:#e8c877;--accent:#e2303f;--label:#c9a14a;--body:#eadfca;--strong:#f0d28a;--rule:#b52331;
  --box:#0000004d;--boxline:#c9a14a59;--f1:#c9a14a;--f2:#7d1520;--grain:.3;--blend:soft-light}
.card[data-theme="blush"]{--bg:#fdf8f4;
  --wash:radial-gradient(ellipse 65% 45% at 50% 50%,#fff 0,transparent 70%),radial-gradient(ellipse 55% 30% at 0% 0%,#f9dde3 0,transparent 70%),radial-gradient(ellipse 55% 30% at 100% 100%,#f9dde3 0,transparent 70%);
  --shadow:#5e214255;--name:#5e2142;--accent:#a83a62;--label:#7a5a26;--body:#3b2a31;--strong:#5e2142;--rule:#c45d7d;
  --box:#fff8f8cc;--boxline:#efc9d3;--f1:#a8834a;--f2:#e4b9c4;--grain:.22;--blend:multiply}

.layer{position:absolute;inset:0;pointer-events:none}
.grain{z-index:1;width:100%;height:100%;opacity:var(--grain);mix-blend-mode:var(--blend)}
.frame{position:absolute;inset:4cqw;width:92cqw;height:133cqw;pointer-events:none;z-index:2}
canvas.air{z-index:3;width:100%;height:100%}
.branch{position:absolute;pointer-events:none;overflow:visible;z-index:4}
.branch.tl{top:-14cqw;left:-15cqw;width:62cqw;transform-origin:8% 8%;animation:swayA 6s ease-in-out infinite alternate}
.branch.br{bottom:-9cqw;right:-10cqw;width:34cqw;transform:rotate(180deg);transform-origin:50% 50%;animation:swayB 7s ease-in-out infinite alternate}
@keyframes swayA{from{transform:rotate(-1.2deg)}to{transform:rotate(1.6deg)}}
@keyframes swayB{from{transform:rotate(178.8deg)}to{transform:rotate(181.4deg)}}
.card[data-theme="thread"] .branch.br,.card[data-theme="breeze"] .branch.br{display:none}
.card[data-theme="thread"] .branch.tl{width:40cqw;top:-7cqw;left:-7cqw}
.card[data-theme="thread"] .frame{display:none}
.extra{display:none}
.card[data-theme="lacquer"] .x-lacquer,.card[data-theme="thread"] .x-thread,.card[data-theme="breeze"] .x-breeze{display:block}

/* lacquer: seigaiha waves + rising lanterns */
.seigaiha{position:absolute;left:0;right:0;bottom:0;height:34cqw;width:100%;z-index:1;opacity:.22;
  -webkit-mask:linear-gradient(transparent,#000 70%);mask:linear-gradient(transparent,#000 70%)}
.lantern{position:absolute;bottom:-14cqw;width:6.4cqw;z-index:3;animation:rise linear infinite;filter:drop-shadow(0 0 2.2cqw #ffb34788)}
.lantern svg{display:block;width:100%;animation:bob 3.2s ease-in-out infinite alternate;transform-origin:50% 0}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-165cqw)}}
@keyframes bob{from{transform:rotate(-5deg) translateX(-1cqw)}to{transform:rotate(5deg) translateX(1cqw)}}

/* thread */
.thread{position:absolute;inset:0;width:100cqw;height:141cqw;z-index:4;overflow:visible}
.thread .string{fill:none;stroke:#d8283a;stroke-width:.55;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 0 .5px #ff4a5a);stroke-dasharray:1;stroke-dashoffset:0;animation:draw 5s cubic-bezier(.6,.05,.3,1) .4s backwards}
.thread .rest{fill:none;stroke:#c9a14a;stroke-width:.22;opacity:.8}
.thread .ring{fill:none;stroke:#d8283a;stroke-width:.45;animation:pop .6s ease-out backwards}
.thread .r1{animation-delay:.2s}.thread .r2{animation-delay:5.2s}
.thread .heart{transform-origin:50px 6.5px;animation:beat 1.6s ease-in-out 5.6s infinite}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.2)}to{opacity:1}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.1)}}

/* breeze: hanko seal */
.seal{position:absolute;left:9.5cqw;bottom:10cqw;width:10.5cqw;z-index:5;transform:rotate(-9deg);opacity:.92}

/* ---------- content ---------- */
.content{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;text-align:center;padding:21.5cqw 16cqw 12cqw;justify-content:space-between}
.bism{font-family:Amiri,serif;font-weight:700;font-size:4.6cqw;color:var(--strong);line-height:1.45;direction:rtl}
.salam{margin-top:2cqw;font-size:2.9cqw;letter-spacing:.7cqw;text-transform:uppercase;color:var(--label);font-weight:700}
.lede{font-size:3.4cqw;line-height:1.3;color:var(--body)}
.event{font-family:"Great Vibes",cursive;font-size:7.6cqw;color:var(--accent);line-height:1;margin-top:1cqw}
.names{display:flex;flex-direction:column;align-items:center;margin-top:1cqw}
.name{font-family:"Great Vibes",cursive;color:var(--name);line-height:1.12;font-size:8.2cqw;padding:0 2cqw}
.amp{font-family:"Great Vibes",cursive;color:var(--label);font-size:8.2cqw;line-height:.95}
.bride{font-size:3.1cqw;letter-spacing:.6cqw;text-transform:uppercase;color:var(--label);font-weight:700;margin:.4cqw 0 1.4cqw}
.bride + .name{font-size:6.9cqw}
.after{font-size:3.3cqw;color:var(--body);margin-top:.6cqw}.after:empty{display:none}
.card:not([data-theme="blush"]) .name{background:linear-gradient(100deg,#8c6420 0%,#e9c46a 18%,#fff0c2 30%,#c99a3c 44%,#8c6420 56%,#f2d68e 74%,#b8892f 100%);
  background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:foil 7s linear infinite}
.card[data-theme="lacquer"] .name{background-image:linear-gradient(100deg,#c99a3c 0%,#ffe9a8 18%,#fffaf0 30%,#f0c96a 44%,#c99a3c 56%,#ffe5a0 74%,#e0ad4c 100%)}
@keyframes foil{from{background-position:100% 0}to{background-position:-160% 0}}
.when{width:100%;color:var(--strong)}
.date{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:3cqw}
.date .side{border-top:.22cqw solid var(--rule);border-bottom:.22cqw solid var(--rule);padding:1.2cqw 0;font-size:3.1cqw;font-weight:700;letter-spacing:.3cqw;text-transform:uppercase;white-space:nowrap}
.date .day{font-size:9.5cqw;font-weight:500;line-height:.85}
.time{margin-top:1.2cqw;font-size:3.4cqw;font-weight:700;letter-spacing:.35cqw;color:var(--strong)}
.time span{color:var(--label);padding:0 1cqw}
.venue-row{display:flex;align-items:center;gap:3cqw;text-align:left;width:100%;background:var(--box);border:.2cqw solid var(--boxline);border-radius:2cqw;padding:1.8cqw 3cqw}
.venue{flex:1;font-size:3.15cqw;line-height:1.35;color:var(--body)}
.venue small,.rsvp small{display:block;font-size:2.8cqw;letter-spacing:.7cqw;text-transform:uppercase;color:var(--label);font-weight:700;margin-bottom:.5cqw}
.venue strong{color:var(--strong);font-weight:700;font-size:3.7cqw;display:block;white-space:nowrap}
.qr{flex:none;width:17cqw;text-align:center;font-size:2.2cqw;letter-spacing:.1cqw;white-space:nowrap;color:var(--strong);text-transform:uppercase;font-weight:700}
.qr a{display:block;background:#fff;padding:1.1cqw;border:.25cqw solid var(--f1);border-radius:1cqw;margin-bottom:.7cqw}
.qr img{display:block;width:100%;height:auto}
.rsvp{font-size:3.6cqw;color:var(--strong);margin-top:1cqw}
.rsvp small{letter-spacing:1cqw}
.rsvp a{color:inherit;text-decoration:none;font-weight:700}
.close{font-family:"Great Vibes",cursive;font-size:4.4cqw;color:var(--accent);margin-top:.4cqw}

/* ---------- actions ---------- */
.actions{width:min(100%,560px);display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.btn{display:flex;align-items:center;justify-content:center;padding:13px 10px;border-radius:999px;text-decoration:none;text-align:center;
  font:700 16px/1.1 "Cormorant Garamond",serif;letter-spacing:.04em;font-variant-numeric:lining-nums;border:1.5px solid var(--gold);color:var(--page-ink);background:transparent}
.btn.primary{background:linear-gradient(100deg,#9c7a32,#e6c472,#a8822f);color:#1a1210;border:0;grid-column:1/-1}
body.light .btn{border-color:#5e2142;color:#5e2142}body.light .btn.primary{background:#5e2142;color:#fdf3f5}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.foot{margin-top:18px;font-size:15px;opacity:.7;text-align:center}

/* ---------- envelope intro ---------- */
.envelope{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#2a0d10,#0a0606 70%);cursor:pointer;transition:opacity .9s .9s}
.env{position:relative;width:min(84vw,360px);aspect-ratio:1.45;perspective:900px}
.env-body{position:absolute;inset:0;background:linear-gradient(160deg,#1b1413,#0d0909);border:1.5px solid #c9a14a;border-radius:6px;box-shadow:0 30px 60px #000a}
.env-body::after{content:"";position:absolute;inset:0;background:linear-gradient(to top right,transparent 49.6%,#c9a14a66 50%,transparent 50.4%),linear-gradient(to top left,transparent 49.6%,#c9a14a66 50%,transparent 50.4%)}
.env-flap{position:absolute;left:0;right:0;top:0;height:58%;transform-origin:top;transition:transform .8s cubic-bezier(.5,0,.3,1) .35s;z-index:2}
.env-flap::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#241a18,#120d0c);clip-path:polygon(0 0,100% 0,50% 100%)}
.env-flap::after{content:"";position:absolute;inset:0;background:#c9a14a;clip-path:polygon(0 0,100% 0,50% 100%,50% 97.5%,97% 1.5%,3% 1.5%,50% 97.5%,50% 100%)}
.wax{position:absolute;left:50%;top:58%;width:23%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:3;transition:transform .4s,opacity .4s;filter:drop-shadow(0 4px 6px #0008)}
.env-cta{position:absolute;left:0;right:0;top:calc(100% + 22px);text-align:center;color:#e6c472;font:400 26px "Great Vibes",cursive;animation:breathe 2s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45}}
.envelope.open .wax{transform:translate(-50%,-50%) scale(1.5);opacity:0}
.envelope.open .env-flap{transform:rotateX(180deg)}
.envelope.open .env{animation:sink 1s ease-in .9s forwards}
.envelope.open{opacity:0;pointer-events:none}
@keyframes sink{to{transform:translateY(40vh) scale(.9)}}
/* ---------- Urdu ---------- */
.card[lang="ur"] .content{font-family:"Noto Nastaliq Urdu",serif;padding-top:18.5cqw;padding-bottom:11.5cqw}
.card[lang="ur"] .content *{letter-spacing:0!important;text-transform:none!important}
.card[lang="ur"] .salam{font-family:Gulzar,serif;font-size:3.8cqw;line-height:1.5;margin-top:3.4cqw;font-weight:400}
.card[lang="ur"] .lede{font-size:3.1cqw;line-height:1.75;margin-bottom:.8cqw}
.card[lang="ur"] .lede{order:1}.card[lang="ur"] .names{order:2}.card[lang="ur"] .event{order:3}.card[lang="ur"] .when{order:4}.card[lang="ur"] .venue-row{order:5}.card[lang="ur"] .content>div:last-child{order:6}
.card[lang="ur"] .event{font-family:Gulzar,serif;font-size:6.6cqw;line-height:1.4;margin:1cqw 0 0;display:flex;align-items:center;gap:3cqw}
.card[lang="ur"] .event::before,.card[lang="ur"] .event::after{content:"";width:13cqw;height:2.2cqw;background:radial-gradient(circle,var(--accent) 0 .45cqw,transparent .5cqw) center/2.2cqw 2.2cqw no-repeat,linear-gradient(var(--label),var(--label)) center/100% .16cqw no-repeat;opacity:.75}
.card[lang="ur"] .names{margin-top:0}
.card[lang="ur"] .name{font-family:Gulzar,serif;font-size:7cqw;line-height:1.38;padding:0 3cqw}
.card[lang="ur"] .name small{font-family:"Noto Nastaliq Urdu",serif;font-size:.42em;color:var(--label);-webkit-text-fill-color:var(--label);font-weight:600;vertical-align:.35em;margin-left:1.2cqw}
.card[lang="ur"] .bride{display:none}
.card[lang="ur"] .after{font-size:3.05cqw;line-height:1.8;margin-top:.6cqw}
.card[lang="ur"] .time i{font-style:normal;color:var(--label)}.card[lang="ur"] .time span{padding:0 1.2cqw}
.card[lang="ur"] .amp{font-family:"Noto Nastaliq Urdu",serif;font-size:3.2cqw;line-height:1.6;font-weight:600;display:flex;align-items:center;gap:2.5cqw;margin:-.6cqw 0 1cqw}
.card[lang="ur"] .amp::before,.card[lang="ur"] .amp::after{content:"";width:9cqw;height:.18cqw;background:linear-gradient(90deg,transparent,var(--label),transparent)}
.card[lang="ur"] .date .side{font-size:3.4cqw;line-height:1.8;padding:.1cqw 0;font-weight:600}
.card[lang="ur"] .date .day{font-family:"Cormorant Garamond",serif;font-size:8.6cqw}
.card[lang="ur"] .time{font-size:3.15cqw;line-height:1.6;margin-top:.4cqw;font-weight:600}
.card[lang="ur"] .venue-row{text-align:right;padding:.8cqw 3cqw;margin-top:1.2cqw}
.card[lang="ur"] .venue{font-size:2.9cqw;line-height:2}
.card[lang="ur"] .venue strong{font-size:3.5cqw;line-height:2.05}
.card[lang="ur"] .venue small,.card[lang="ur"] .rsvp small{font-size:2.8cqw;line-height:1.6;margin:0;font-weight:600}
.card[lang="ur"] .qr{width:13.5cqw;font-size:2.3cqw;line-height:1.7;font-family:"Noto Nastaliq Urdu",serif}
.card[lang="ur"] .qr a{margin-bottom:2cqw}
.card[lang="ur"] .rsvp{margin-top:0;font-size:3.6cqw;line-height:1.3;font-family:"Cormorant Garamond",serif}
.card[lang="ur"] .rsvp small{font-family:"Noto Nastaliq Urdu",serif;display:inline;margin:0 0 0 2.4cqw;font-size:3cqw}
.card[lang="ur"] .rsvp a{font-family:"Cormorant Garamond",serif}
.card[lang="ur"] .close{font-family:"Noto Nastaliq Urdu",serif;font-size:2.85cqw;line-height:1.9;margin-top:1.4cqw;white-space:nowrap;color:var(--accent);font-weight:600}
body.ur .btn,body.ur .foot,body.ur .countdown,body.ur .env-cta,body.ur .picker{font-family:"Noto Nastaliq Urdu",serif;letter-spacing:0}
body.ur .btn{font-size:15px;line-height:2;padding:8px 10px}
body.ur .btn bdi{font-family:"Cormorant Garamond",serif;font-size:17px}
body.ur .env-cta{font-size:20px}
.card[data-theme="blush"] .name{background:linear-gradient(100deg,#5e2142 0%,#8a3a5c 22%,#b0684c 34%,#d29a68 40%,#8a3a5c 52%,#5e2142 70%,#7d3459 100%);
  background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:foil 9s linear infinite}
.countdown{margin-top:16px;font-size:20px;color:var(--gold);text-align:center}
.countdown:empty{display:none}
body.light .countdown{color:#a83a62}
/* the white design gets an ivory envelope with a rose seal */
body.light .envelope{background:radial-gradient(circle at 50% 40%,#fff8f6,#f1dde0 75%)}
body.light .env-body{background:linear-gradient(160deg,#fffdf9,#f7ece6);border-color:#c9a26a;box-shadow:0 30px 60px #5e214233}
body.light .env-body::after{background:linear-gradient(to top right,transparent 49.6%,#c9a26a88 50%,transparent 50.4%),linear-gradient(to top left,transparent 49.6%,#c9a26a88 50%,transparent 50.4%)}
body.light .env-flap::before{background:linear-gradient(180deg,#fdf3ef,#f3e2dc)}
body.light .env-flap::after{background:#c9a26a}
body.light .env-cta{color:#a83a62}
@media (prefers-reduced-motion:reduce){.envelope{display:none}.branch,.lantern,.lantern svg,.name,.thread *{animation:none!important}}
@media print{body{background:#fff;padding:0}.actions,.foot,.picker,.envelope{display:none}.card{box-shadow:none;width:148mm}}
</style>
</head>
<body>

<div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Open the invitation">
  <div class="env">
    <div class="env-body"></div>
    <div class="env-flap"></div>
    <svg class="wax" viewBox="-50 -50 100 100" aria-hidden="true">

<script>
// Fill the card from invite.js. Text on the page (buttons, labels) comes from UI[lang].
const UI={
  en:{venue:"Venue",scan:"Scan for map",rsvp:"RSVP",directions:"Directions to the venue",calendar:"Add to calendar",save:"Save card",call:"Call",
      foot:"With love and duas",envcta:"Tap to open",pick_h:"Choose your design",pick_p:"Five designs, same invitation. Tap one to see it come alive.",
      time_label:"",time_sep:"—",days:n=>`${n} days to go`,today:"Today is the day!",title:e=>`${e.split(" ")[0]} Invitation`},
  ur:{venue:"بمقام",scan:"نقشہ اسکین کریں",rsvp:"برائے رابطہ",directions:"شادی ہال تک راستہ",calendar:"کیلنڈر میں شامل کریں",save:"کارڈ محفوظ کریں",call:"کال کریں",
      foot:"دعاؤں کے ساتھ",envcta:"کھولنے کے لیے چھوئیں",pick_h:"ڈیزائن منتخب کریں",pick_p:"ایک دعوت نامہ، پانچ ڈیزائن۔",
      time_label:"وقت: ",time_sep:"تا",days:n=>`${n} دن باقی ہیں`,today:"آج شادی کا دن ہے!",title:e=>`دعوت نامہ · ${e}`}};
(()=>{const I=window.INVITE,L=I.lang==="ur"?"ur":"en",T=UI[L],$=s=>document.querySelectorAll(s);
  const loc=L==="ur"?"ur-PK":"en-GB",d=new Date(I.date+"T12:00:00");
  const t12=hm=>{let[h,m]=hm.split(":").map(Number),c=`${(h%12)||12}${m?":"+String(m).padStart(2,"0"):""}`;
    if(L==="en")return `${(h%12)||12}:${String(m).padStart(2,"0")} ${h<12?"AM":"PM"}`;
    return `${h<12?"صبح":h<15?"دوپہر":h<18?"سہ پہر":h<20?"شام":"رات"} ${c} بجے`};
  const ur=L==="ur";
  const utc=hm=>new Date(`${I.date}T${hm}:00${I.utc_offset}`).toISOString().replace(/[-:]|\.\d{3}/g,"");
  const tel=n=>"tel:+92"+n.replace(/\D/g,"").replace(/^0/,"");
  const F={joiner:"&",after_names:"",...I,weekday:(ur?"بروز ":"")+d.toLocaleDateString(loc,{weekday:"long"}),day:d.getDate(),
    monthyear:d.toLocaleDateString(loc,{month:L==="ur"?"long":"short"})+(L==="ur"?" ":" · ")+d.getFullYear(),t1:t12(I.time_start),t2:t12(I.time_end)};
  const card=document.getElementById("card");card.lang=L;card.dir=L==="ur"?"rtl":"ltr";document.documentElement.lang=L;
  if(L==="ur"){document.body.classList.add("ur");["actions","countdown","foot"].forEach(id=>document.getElementById(id).dir="rtl")}
  $("[data-f]").forEach(e=>e.textContent=F[e.dataset.f]);
  if(L==="ur"){const n2=document.querySelector('[data-f="name_2"]');n2.innerHTML=`<small></small><span></span>`;n2.firstChild.textContent=I.name_2_prefix;n2.lastChild.textContent=I.name_2;
    const ad=document.querySelector('[data-f="venue_address"]');ad.textContent=I.venue_address.replace(/ (\S+)$/,"\u00a0$1")}
  $("[data-t]").forEach(e=>e.textContent=T[e.dataset.t]);
  const H={maps:"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(I.maps_query),
    calendar:"https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(`${I.event} – ${I.name_1}`)+
      `&dates=${utc(I.time_start)}/${utc(I.time_end)}&location=`+encodeURIComponent(I.venue_name+", "+I.venue_address)};
  $("[data-href]").forEach(e=>e.href=H[e.dataset.href]);
  document.getElementById("rsvp").innerHTML=I.rsvp.map(n=>`<a href="${tel(n)}" dir="ltr">${n}</a>`).join(" &nbsp;|&nbsp; ");
  document.getElementById("actions").insertAdjacentHTML("beforeend",I.rsvp.map(n=>`<a class="btn" href="${tel(n)}">${T.call} <bdi dir="ltr">${n}</bdi></a>`).join(""));
  document.getElementById("foot").textContent=T.foot+(L==="ur"?" — ":" · ")+d.getDate()+" "+d.toLocaleDateString(loc,{month:"long"})+" "+d.getFullYear();
  const left=Math.ceil((new Date(`${I.date}T${I.time_start}:00${I.utc_offset}`)-Date.now())/864e5);
  document.getElementById("countdown").textContent=left>1?T.days(left):left>=0?T.today:"";
  document.title=T.title(I.event);
})();
</script>

      ${B("translate(280 132) rotate(160)",.95,"side")}${B("translate(52 -6) rotate(10)",.95,"sakura2")}${B("translate(40 30) rotate(50)",1)}${B("translate(320 70) rotate(0)",.85,"sakura2")}

      ${B("translate(172 74) rotate(60)",1,"sakura2")}${B("translate(130 70) rotate(-30)",.9)}${B("translate(70 22) rotate(15)",1.1,"sakura2")}${B("translate(12 50) rotate(80)",1.15)}
      ${B("translate(290 92) rotate(35)",.95,"sakura2")}${B("translate(205 92) rotate(170)",.8,"side")}${B("translate(112 22) rotate(-20)",1,"bud")}
    </g>
  </g></defs>`;
}

// Lanterns for the lacquer design: negative delays spread them across the sky.
const lanternSVG = `<svg viewBox="0 0 40 64"><line x1="20" y1="0" x2="20" y2="7" stroke="#2a1206" stroke-width="1.4"/>
  <rect x="11" y="6" width="18" height="5" rx="1.5" fill="#1a0a05"/><rect x="11" y="53" width="18" height="5" rx="1.5" fill="#1a0a05"/>
  <ellipse cx="20" cy="32" rx="17" ry="22" fill="#ff9d3a"/><ellipse cx="20" cy="32" rx="17" ry="22" fill="url(#lg)"/>
  <g stroke="#a3360f" stroke-width=".8" fill="none" opacity=".55"><ellipse cx="20" cy="32" rx="9" ry="22"/><path d="M3 22 H37 M3 32 H37 M3 42 H37"/></g>
  <line x1="20" y1="58" x2="20" y2="64" stroke="#e8b84a" stroke-width="1.6"/>
  <defs><radialGradient id="lg" cx="50%" cy="45%"><stop offset="0" stop-color="#fff2c4" stop-opacity=".95"/><stop offset=".6" stop-color="#ff7a2a" stop-opacity=".35"/><stop offset="1" stop-color="#b8160e" stop-opacity=".9"/></radialGradient></defs></svg>`;
document.getElementById("lanterns").innerHTML = [[7,26,-4,.95],[86.5,32,-15,.8],[8.5,30,-19,.7],[86,24,-8,.9],[6.5,36,-30,.6]]
  .map(([l,d,dl,s])=>`<div class="lantern" style="left:${l}cqw;animation-duration:${d}s;animation-delay:${dl}s;scale:${s}">${lanternSVG}</div>`).join("");

// ---------- the wind: a flow field that moves petals, gold dust and visible air currents ----------
const card = document.getElementById("card"), cv = document.getElementById("air"), ctx = cv.getContext("2d");
const petalPath = new Path2D(PETAL);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let W=0,H=0,cfg,petals=[],dust=[],streaks=[],t=0;
const rnd=(a,b)=>a+Math.random()*(b-a);
function size(){const r=card.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
const gust = t => Math.pow(Math.max(0,Math.sin(t*.33)),3);
function wind(x,y,t){const u=x/W,v=y/H,g=gust(t),c=cfg.curl;
  return [W*(.035+.07*g+.02*c*Math.sin(v*6+t*.7)), H*(.012+.03*c*Math.sin(u*4.2+v*3+t*.55)-.012*g*Math.sin(u*3+t))]}
function spawnPetal(p,anywhere){p.x=anywhere?rnd(0,W):rnd(-.15*W,.45*W);p.y=anywhere?rnd(0,H):rnd(-.12*H,.14*H);
  p.z=rnd(.55,1.25);p.r=rnd(0,6.3);p.vr=rnd(-1.6,1.6);p.f=rnd(0,6.3);p.vf=rnd(1.5,4);p.ph=rnd(0,6.3);p.col=cfg.colors[Math.random()*cfg.colors.length|0];return p}
function spawnStreak(s,anywhere){s.x=anywhere?rnd(0,W):rnd(-.2*W,0);s.y=rnd(0,H);s.h=[];s.sp=rnd(.7,1.2);s.ph=rnd(0,6.3);return s}
function reset(){petals=Array.from({length:cfg.petals},()=>spawnPetal({},true));
  dust=Array.from({length:cfg.dust},()=>({x:rnd(0,W),y:rnd(0,H),s:rnd(.6,1.8),ph:rnd(0,6.3)}));
  streaks=Array.from({length:cfg.streaks},()=>spawnStreak({},true))}
function step(dt){t+=dt;const g=gust(t);
  for(const p of petals){const [vx,vy]=wind(p.x,p.y,t);p.x+=(vx*p.z+Math.sin(t*1.3+p.ph)*W*.012)*dt;p.y+=(vy*p.z+H*.018*p.z)*dt;
    p.r+=p.vr*dt*(1+2*g);p.f+=p.vf*dt;if(p.x>W*1.08||p.y>H*1.05)spawnPetal(p,false)}
  for(const d of dust){const [vx,vy]=wind(d.x,d.y,t);d.x+=vx*.25*dt;d.y+=(vy*.2-H*.01)*dt;if(d.x>W)d.x-=W;if(d.y<0)d.y+=H;if(d.y>H)d.y-=H}
  for(const s of streaks){const v=s.y/H,u=s.x/W;s.x+=W*(.16+.12*g)*s.sp*dt;s.y+=H*.05*Math.sin(u*5+v*2+t*.8+s.ph)*s.sp*dt;s.h.push([s.x,s.y]);if(s.h.length>46)s.h.shift();if(s.x>W*1.15)spawnStreak(s,false)}}
const calm=x=>.1+.9*Math.min(1,Math.abs(x/W-.5)*3.2), still=x=>(x>W*.14&&x<W*.86)?.1:1;
function draw(){ctx.clearRect(0,0,W,H);const u=W/100;
  ctx.lineCap="round";
  for(const s of streaks){const h=s.h;for(let i=1;i<h.length;i++){ctx.strokeStyle=`rgba(232,196,112,${(i/h.length)*.7*still(h[i][0])})`;ctx.lineWidth=u*.32*(i/h.length);
    ctx.beginPath();ctx.moveTo(h[i-1][0],h[i-1][1]);ctx.lineTo(h[i][0],h[i][1]);ctx.stroke()}}
  for(const d of dust){const a=.35+.45*Math.sin(t*2+d.ph);ctx.fillStyle=`rgba(240,205,120,${Math.max(0,a)})`;ctx.beginPath();ctx.arc(d.x,d.y,d.s*u*.18,0,7);ctx.fill()}
  for(const p of petals){const k=p.z*u*.11,fl=Math.cos(p.f);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.scale(k*(.15+.85*Math.abs(fl)),k);
    ctx.globalAlpha=(.55+.4*p.z/1.25)*calm(p.x);ctx.fillStyle=p.col;ctx.fill(petalPath);if(fl<0){ctx.fillStyle="rgba(0,0,0,.18)";ctx.fill(petalPath)}ctx.restore()}
  ctx.globalAlpha=1}
let last=0;
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;step(dt);draw();requestAnimationFrame(loop)}

// ---------- picker ----------
const chips=document.getElementById("chips"), blurb=document.getElementById("blurb"), save=document.getElementById("save"), defsEl=document.getElementById("defs");
const ALLOWED=window.INVITE.themes||Object.keys(THEMES);
if(ALLOWED.length<2)document.querySelector(".picker").hidden=true;
chips.innerHTML=Object.entries(THEMES).filter(([k])=>ALLOWED.includes(k)).map(([k,v])=>`<button class="chip" data-k="${k}" aria-pressed="false"><span class="sw" style="background:${v.sw}"></span>${v.label}</button>`).join("");
function setTheme(k){if(!ALLOWED.includes(k))k=ALLOWED.includes(window.INVITE.theme)?window.INVITE.theme:ALLOWED[0];const th=THEMES[k];card.dataset.theme=k;defsEl.innerHTML=defs(th.p);
  document.body.classList.toggle("light",k==="blush");
  chips.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c.dataset.k===k));
  blurb.textContent=th.blurb;save.href=`card-${k}.png`;save.download=`barat-invite-${k}.png`;
  card.querySelectorAll(".thread .string,.thread .ring").forEach(e=>{e.style.animation="none";e.offsetWidth;e.style.animation=""});
  cfg=th.air;size();reset();for(let i=0;i<120;i++)step(1/30);draw();
  try{history.replaceState(null,"","#"+k)}catch(e){}}
chips.addEventListener("click",e=>{const b=e.target.closest(".chip");if(b)setTheme(b.dataset.k)});
new ResizeObserver(()=>{size();draw()}).observe(card);
setTheme(location.hash.slice(1)||window.INVITE.theme);
if(!reduce)requestAnimationFrame(loop);

// ---------- envelope: once per visit ----------
const env=document.getElementById("envelope");
let seen=false;try{seen=sessionStorage.getItem("env")==="1"}catch(e){}
if(seen||reduce)env.remove();else{const open=()=>{env.classList.add("open");try{sessionStorage.setItem("env","1")}catch(e){}setTimeout(()=>env.remove(),2000)};
  env.addEventListener("click",open);env.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open()}})}
</script>
